name: Probe Pegelparameter

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Parameter testen
        shell: bash
        run: |
          set -u
          URL="https://pegelportal.brandenburg.de/messstelle.php?fgid=7&pkz=5530401&thema=q_graph"

          for SPEC in             "none:"             "stunde:stunde"             "tag:tag"             "viertel:viertel"             "viertelstunde:viertelstunde"             "15:15"             "15min:15min"             "minute:minute"             "1:1"             "24:24"             "24h:24h"; do

            NAME="${SPEC%%:*}"
            VALUE="${SPEC#*:}"

            echo
            echo "==================== ${NAME} / ${VALUE} ===================="

            if [ "${NAME}" = "none" ]; then
              curl -L --fail --silent --show-error                 -X POST                 -H "Content-Type: application/x-www-form-urlencoded"                 --data "smode=c"                 "${URL}"                 -o "probe-${NAME}.dat"
            else
              curl -L --fail --silent --show-error                 -X POST                 -H "Content-Type: application/x-www-form-urlencoded"                 --data "smode=c&sdatum=${VALUE}"                 "${URL}"                 -o "probe-${NAME}.dat"
            fi

            echo "--- file ---"
            file "probe-${NAME}.dat" || true
            echo "--- first lines ---"
            head -8 "probe-${NAME}.dat" || true
            echo "--- matching timestamps ---"
            grep -Eo '[0-9]{2}\.[0-9]{2}\.[0-9]{4}[[:space:]][0-9]{2}:[0-9]{2}' "probe-${NAME}.dat" | head -20 || true
          done
