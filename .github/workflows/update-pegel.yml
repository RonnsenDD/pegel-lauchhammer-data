name: Pegel Lauchhammer

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-pegel:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

            - name: Download-Aufruf des Pegelportals untersuchen
        run: |
          curl -L --fail --silent --show-error \
            "https://pegelportal.brandenburg.de/messstelle.php?fgid=7&pkz=5530401&thema=q_graph" \
            -o pegelseite.html

          echo "===== Download-/Formular-Struktur ====="
          grep -in -B 15 -A 35 "24 Stunden" pegelseite.html || true

          echo "===== CSV-/Download-Verweise ====="
          grep -oiE '.{0,120}(csv|download).{0,180}' pegelseite.html | head -50 || true

      - name: Pegeldaten auswerten
        shell: python
        run: |
          import csv
          import json
          from datetime import datetime
          from pathlib import Path

          csv_file = Path("pegel.csv")

          rows = []

          with csv_file.open("r", encoding="utf-8-sig", newline="") as f:
              reader = csv.reader(f, delimiter=";")

              header = next(reader)

              for row in reader:
                  if len(row) < 2:
                      continue

                  timestamp = row[0].strip().strip('"')
                  value = row[1].strip().strip('"')

                  if not timestamp or not value:
                      continue

                  try:
                      water_level = float(value)
                  except ValueError:
                      continue

                  # -777 = Fehlwert laut LfU Brandenburg
                  if water_level == -777:
                      continue

                  try:
                      dt = datetime.strptime(timestamp, "%d.%m.%Y %H:%M")
                  except ValueError:
                      continue

                  rows.append({
                      "dt": dt,
                      "measuredAt": dt.strftime("%Y-%m-%dT%H:%M:%S"),
                      "waterLevelCm": water_level
                  })

          if not rows:
              raise RuntimeError("Keine gültigen Pegeldaten gefunden.")

          rows.sort(key=lambda x: x["dt"])

          current = rows[-1]

          # Verlauf: letzte 24 Stunden
          history = rows[-97:]

          # Tendenz aus aktuellem und vorherigem gültigen Messwert
          if len(rows) >= 2:
              previous = rows[-2]["waterLevelCm"]

              if current["waterLevelCm"] > previous:
                  trend = "steigend"
              elif current["waterLevelCm"] < previous:
                  trend = "fallend"
              else:
                  trend = "gleichbleibend"
          else:
              trend = "unbekannt"

          data = {
              "station": "Lauchhammer",
              "stationNumber": "5530401",
              "river": "Schwarze Elster",

              "current": {
                  "waterLevelCm": current["waterLevelCm"],
                  "measuredAt": current["measuredAt"]
              },

              "trend": trend,

              "history": [
                  {
                      "measuredAt": item["measuredAt"],
                      "waterLevelCm": item["waterLevelCm"]
                  }
                  for item in history
              ],

              "source": {
                  "provider": "LfU Brandenburg",
                  "url": "https://pegelportal.brandenburg.de/messstelle.php?fgid=7&pkz=5530401&thema=q_graph"
              },

              "status": "ok"
          }

          Path("pegel.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pegel.json

          if git diff --cached --quiet; then
            echo "Keine Änderung."
            exit 0
          fi

          git commit -m "Aktualisiere Pegeldaten"
          git push
