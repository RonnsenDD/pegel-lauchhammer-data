name: Pegel Lauchhammer

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  diagnose-pegel:
    runs-on: ubuntu-latest

    steps:
      - name: Pegelportal abrufen
        run: |
          curl -L --fail --silent --show-error \
            "https://pegelportal.brandenburg.de/messstelle.php?fgid=7&pkz=5530401&thema=q_graph" \
            -o pegelseite.html

      - name: Download-Struktur untersuchen
        run: |
          echo "===== 24-STUNDEN-BEREICH ====="
          grep -in -B 15 -A 35 "24 Stunden" pegelseite.html || true

          echo "===== CSV / DOWNLOAD ====="
          grep -oiE '.{0,150}(csv|download).{0,200}' pegelseite.html | head -80 || true
